plugins {
    id "com.android.application"
}

android {
    namespace "com.lysyk.chubaka"
    compileSdk 35
    if (System.getenv("ANDROID_NDK_HOME")) {
        ndkPath System.getenv("ANDROID_NDK_HOME")
    } else {
        ndkVersion "27.2.12479018"
    }

    defaultConfig {
        applicationId "com.lysyk.chubaka"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.3.2"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("CHUBAKA_KEYSTORE") ?: "debug.keystore")
            storePassword System.getenv("CHUBAKA_KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("CHUBAKA_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("CHUBAKA_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress "tar"
    }
}
